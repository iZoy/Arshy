name: Release candidate

on:
  push:
    tags:
      - 'v*.*.*-*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify release version
        shell: bash
        run: test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "${GITHUB_REF_NAME#v}"
      - name: Test release target
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}
      - name: Code sign macOS binaries
        if: runner.os == 'macOS'
        run: |
          codesign -s - target/${{ matrix.target }}/release/arshy
          codesign -s - target/${{ matrix.target }}/release/arshyd
      - name: Package and checksum
        shell: bash
        run: |
          archive="arshy-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          COPYFILE_DISABLE=1 tar -C "target/${{ matrix.target }}/release" -czf "$archive" arshy arshyd
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
      - name: Attest release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            arshy-*.tar.gz
            arshy-*.tar.gz.sha256
      - name: Upload verified target
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            arshy-*.tar.gz
            arshy-*.tar.gz.sha256
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all targets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Verify complete artifact set and checksums
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -name 'arshy-*.tar.gz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name 'arshy-*.tar.gz.sha256' | wc -l)" -eq 4
          for checksum in arshy-*.tar.gz.sha256; do
            sha256sum --check "$checksum"
          done
      - name: Create draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            arshy-*.tar.gz
            arshy-*.tar.gz.sha256
