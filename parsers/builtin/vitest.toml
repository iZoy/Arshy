[meta]
name = "vitest"
description = "Vitest test runner"
detect = ["vitest"]
priority = 55

[[pattern]]
name = "vitest-fail"
regex = '^\s*FAIL\s+(.+?)(?:\s+>\s+(.+))?$'
event_type = "diagnostic"
severity = "error"
fields = { file = 1, message = 2 }

[[pattern]]
name = "vitest-pass"
regex = '^\s*PASS\s+(.+?)(?:\s+>\s+(.+))?$'
event_type = "test_result"
severity = "info"
fields = { file = 1, message = 2 }

[[pattern]]
name = "vitest-location"
regex = '^\s*[❯›]\s+(.+?):(\d+):(\d+)'
event_type = "location"
severity = "info"
fields = { file = 1, line = 2, column = 3 }

[[pattern]]
name = "vitest-assertion"
regex = '^\s*(?:AssertionError|Error|TypeError|ReferenceError):\s+(.+)$'
event_type = "diagnostic"
severity = "error"
fields = { message = 1 }

[[pattern]]
name = "vitest-summary"
regex = '^\s*Tests\s+(?:(\d+)\s+failed.*?(\d+)\s+passed|(\d+)\s+passed)'
event_type = "summary"
severity = "error"
fields = { message = 0 }

[[pattern]]
name = "vitest-duration"
regex = '^\s*Duration\s+'
event_type = "summary"
severity = "info"
fields = { message = 0 }
