name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # ARM64 Linux (install.sh maps Linux-arm64 to this artifact);
          # ubuntu-24.04-arm is GitHub's native ARM64 hosted runner.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Verify release version
        shell: bash
        run: test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "${GITHUB_REF_NAME#v}"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Code sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign -s - target/${{ matrix.target }}/release/arshy
          codesign -s - target/${{ matrix.target }}/release/arshyd

      - name: Package artifacts
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          ARCHIVE=arshy-${VERSION}-${{ matrix.target }}.tar.gz
          cd target/${{ matrix.target }}/release
          # COPYFILE_DISABLE=1 prevents macOS bsdtar from emitting AppleDouble
          # (._*) entries for files with extended attributes — keeps the
          # published tarballs clean and their checksums stable.
          COPYFILE_DISABLE=1 tar -czf ../../../${ARCHIVE} arshyd arshy
          cd ../../..
          if command -v shasum >/dev/null 2>&1; then shasum -a 256 ${ARCHIVE} > ${ARCHIVE}.sha256; else sha256sum ${ARCHIVE} > ${ARCHIVE}.sha256; fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            arshy-*.tar.gz
            arshy-*.tar.gz.sha256
          generate_release_notes: true

      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            arshy-*.tar.gz
            arshy-*.tar.gz.sha256
