[meta]
name = "vite"
description = "Vite build tool"
detect = ["vite"]
priority = 50

[[pattern]]
name = "vite-error"
regex = '^error: (.+)$'
event_type = "diagnostic"
severity = "error"
fields = { message = 1 }

[[pattern]]
name = "vite-transform-error"
regex = '^Transform failed: (.+)$'
event_type = "diagnostic"
severity = "error"
fields = { message = 1 }

[[pattern]]
name = "vite-file-location"
regex = '^\s+at (.+?):(\d+):(\d+)$'
event_type = "location"
severity = "info"
fields = { file = 1, line = 2, column = 3 }

[[pattern]]
name = "vite-build-failed"
regex = '^Build failed'
event_type = "summary"
severity = "error"
