[meta]
name = "prettier"
description = "Prettier code formatter"
detect = ["prettier"]
priority = 50

[[pattern]]
name = "prettier-check-fail"
regex = '^\[warn\] (.+)$'
event_type = "diagnostic"
severity = "warning"
fields = { message = 1 }

[[pattern]]
name = "prettier-check-error"
regex = '^\[error\] (.+)$'
event_type = "diagnostic"
severity = "error"
fields = { message = 1 }

[[pattern]]
name = "prettier-location"
regex = '^\s+(.+?):(\d+):(\d+)$'
event_type = "location"
severity = "info"
fields = { file = 1, line = 2, column = 3 }

[[pattern]]
name = "prettier-summary"
regex = '^Code style issues found'
event_type = "summary"
severity = "warning"
