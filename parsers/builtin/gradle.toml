[meta]
name = "gradle"
description = "Gradle build tool"
detect = ["gradle", "gradlew"]
priority = 50

[[pattern]]
name = "gradle-error"
regex = '^(\w+\.java):(\d+): error: (.+)$'
event_type = "diagnostic"
severity = "error"
fields = { file = 1, line = 2, message = 3 }

[[pattern]]
name = "gradle-warning"
regex = '^(\w+\.java):(\d+): warning: (.+)$'
event_type = "diagnostic"
severity = "warning"
fields = { file = 1, line = 2, message = 3 }

[[pattern]]
name = "gradle-failed"
regex = '^FAILURE: Build failed'
event_type = "summary"
severity = "error"

[[pattern]]
name = "gradle-success"
regex = '^BUILD SUCCESSFUL'
event_type = "summary"
severity = "info"
