[meta]
name = "esbuild"
description = "esbuild bundler"
detect = ["esbuild"]
priority = 50

[[pattern]]
name = "esbuild-error"
regex = '^\s*(?:✘|X)\s+\[ERROR\]\s+(.+)$'
event_type = "diagnostic"
severity = "error"
fields = { message = 1 }

[[pattern]]
name = "esbuild-location"
regex = '^\s+(.+?):(\d+):(\d+):$'
event_type = "location"
severity = "info"
fields = { file = 1, line = 2, column = 3 }

[[pattern]]
name = "esbuild-simple-error"
regex = '^error: (.+)$'
event_type = "diagnostic"
severity = "error"
fields = { message = 1 }
