name: Parser error
description: Report a missing, incorrect, or duplicated diagnostic
title: "[Parser] "
body:
  - type: input
    id: tool
    attributes:
      label: Tool and version
      placeholder: cargo 1.x, pytest 9.x, ...
    validations:
      required: true
  - type: textarea
    id: command_shape
    attributes:
      label: Command shape
      description: Redact secrets and project-specific values.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Minimal original output
      description: Include only the smallest reviewed sample that reproduces the parse.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected structured fields
      description: State the expected severity, code, file, and line.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public data check
      options:
        - label: I reviewed the command and output and intentionally made them public.
          required: true
