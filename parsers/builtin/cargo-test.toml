[meta]
name = "cargo-test"
description = "Cargo test runner"
detect_full = ["cargo test"]
priority = 55

[[pattern]]
name = "test-fail"
regex = '^test (.+) \.\.\. FAILED$'
event_type = "test_result"
severity = "error"
fields = { file = 1 }

[[pattern]]
name = "test-pass"
regex = '^test (.+) \.\.\. ok$'
event_type = "test_result"
severity = "info"
fields = { file = 1 }

[[pattern]]
name = "test-ignored"
regex = '^test (.+) \.\.\. ignored$'
event_type = "test_result"
severity = "info"
fields = { file = 1 }

[[pattern]]
name = "panic-location"
regex = "panicked at (.+?):(\\d+):(\\d+):?"
event_type = "location"
severity = "error"
fields = { file = 1, line = 2, column = 3 }

[[pattern]]
name = "test-summary-pass"
regex = '^test result: ok\. (\d+) passed.*'
event_type = "summary"
severity = "info"

[[pattern]]
name = "test-summary-fail"
regex = '^test result: FAILED\. (\d+) passed.*'
event_type = "summary"
severity = "error"

[[pattern]]
name = "run-result"
regex = '^error: test (.+)'
event_type = "diagnostic"
severity = "error"
fields = { message = 1 }

[[pattern]]
name = "failure-header"
regex = '^\s*---- (.+) stdout ----$'
event_type = "diagnostic"
severity = "info"
fields = { message = 1 }

[[pattern]]
name = "running-unittests"
regex = '^Running unittests \S+ \((.+)\)$'
event_type = "summary"
severity = "info"
fields = { message = 1 }

[[pattern]]
name = "running-tests"
regex = '^running (\d+) tests?$'
event_type = "summary"
severity = "info"
fields = { message = 1 }

[[pattern]]
name = "doc-tests"
regex = '^Doc-tests\s+(\S+)$'
event_type = "summary"
severity = "info"
fields = { message = 1 }
