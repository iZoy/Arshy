[meta]
name = "webpack"
description = "Webpack bundler"
detect = ["webpack"]
parser_type = "stateful"
priority = 50

[[pattern]]
name = "webpack-error"
regex = '^ERROR in (.+)'
event_type = "diagnostic"
severity = "error"
fields = { message = 1 }
state_transition = "has_error=true"

[[pattern]]
name = "webpack-warning"
regex = '^WARNING in (.+)'
event_type = "diagnostic"
severity = "warning"
fields = { message = 1 }
