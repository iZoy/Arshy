[meta]
name = "uv"
description = "uv Python package manager"
detect = ["uv"]
priority = 50

[[pattern]]
name = "uv-error"
regex = '^error: (.+)$'
event_type = "diagnostic"
severity = "error"
fields = { message = 1 }

[[pattern]]
name = "uv-warning"
regex = '^warning: (.+)$'
event_type = "diagnostic"
severity = "warning"
fields = { message = 1 }

[[pattern]]
name = "uv-install-status"
regex = '^(Installed|Uninstalled|Updated|Added|Removed) (\d+) packages?'
event_type = "summary"
severity = "info"
fields = { message = 0 }

[[pattern]]
name = "uv-resolved"
regex = '^Resolved (\d+) packages?'
event_type = "summary"
severity = "info"

[[pattern]]
name = "uv-audit"
regex = '^(\d+) vulnerabilities? found'
event_type = "diagnostic"
severity = "warning"
fields = { message = 0 }
