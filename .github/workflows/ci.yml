name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --lib --bin arshy --bin arshyd

      - name: Doc
        run: cargo doc --no-deps --document-private-items

      - name: Integration tests (real daemon + MCP proxy processes)
        run: |
          cargo build --bin arshy --bin arshyd
          cargo test --test integration

      - name: Dogfood (run the project through arshy itself)
        run: |
          cargo build --bin arshy --bin arshyd
          ./target/debug/arshy daemon start
          sleep 2
          ARSHY=./target/debug/arshy ./scripts/dogfood.sh
