name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets --workspace

      - name: Doc
        run: cargo doc --no-deps --document-private-items

      - name: Integration tests (real daemon + MCP proxy processes)
        run: |
          cargo build --bin arshy --bin arshyd
          cargo test --test integration

      - name: Coverage (whole repository and critical paths)
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Enforce coverage thresholds
        run: |
          cargo llvm-cov --all-targets --workspace --lcov --output-path lcov.info
          ./scripts/check-coverage.sh lcov.info

      - name: Package audit
        run: cargo package --allow-dirty --no-verify

      - name: Dogfood (run the project through arshy itself)
        run: |
          cargo build --bin arshy --bin arshyd
          ./target/debug/arshy daemon start
          for _ in $(seq 1 20); do
            if ./target/debug/arshy status >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          ./target/debug/arshy status >/dev/null
          ARSHY=./target/debug/arshy ./scripts/dogfood.sh
