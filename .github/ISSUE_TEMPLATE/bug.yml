name: Bug report
description: Report installation, execution, lifecycle, or MCP behavior
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe steps. Redact private paths, commands, and output.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Reviewed doctor report
      description: Optional output from arshy doctor --format json after you review it.
      render: json
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Codex
        - Claude Code
        - Another standard MCP client
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public data check
      options:
        - label: I reviewed the submitted text and intentionally made it public.
          required: true
