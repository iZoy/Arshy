[package]
name = "arshy"
version = "0.1.0"
edition = "2021"
description = "AI Agent's native shell — structured output, auto-mode intelligence, security sandbox"
license = "MIT"
repository = "https://github.com/iZoy/Arshy"
homepage = "https://github.com/iZoy/Arshy"
keywords = ["ai-agent", "mcp", "shell", "structured-output", "cli"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "arshy"
path = "src/main.rs"

[[bin]]
name = "arshyd"
path = "src/daemon/main.rs"

[lib]
name = "arshy_lib"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
libc = "0.2"

notify = "7"
rhai = "1.24"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
strip = "symbols"
lto = "thin"
